<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comissões</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="style.css">
    <style>
        .comissoes-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; flex-wrap: wrap; gap: 1rem; }
        .comissoes-header h2 { color: var(--primary); }
        .resumo-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; margin-bottom: 2rem; }
        .resumo-card { background: var(--card); padding: 1.5rem; border-radius: 12px; box-shadow: var(--shadow); text-align: center; }
        .resumo-card h3 { font-size: 0.9rem; color: var(--text-muted); margin-bottom: 0.5rem; }
        .resumo-card .valor { font-size: 2rem; font-weight: 700; color: var(--primary); }
        .resumo-card.previsao .valor { color: var(--warning); }
        .mes-selector-container { margin: 2rem 0; }
        .mes-selector-container h3 { margin-bottom: 1rem; color: var(--text); }
        .mes-scroll { display: flex; gap: 0.5rem; overflow-x: auto; padding: 1rem 0; scrollbar-width: thin; }
        .mes-btn { padding: 0.8rem 1.5rem; background: var(--card); border: 2px solid var(--border); border-radius: 8px; cursor: pointer; font-weight: 500; white-space: nowrap; transition: all 0.2s; }
        .mes-btn:hover { border-color: var(--primary); }
        .mes-btn.active { background: var(--primary); color: white; border-color: var(--primary); }
        .cards-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 1.5rem; margin-top: 1.5rem; }
        .comissao-card { background: var(--card); border-radius: 12px; box-shadow: var(--shadow); overflow: hidden; border-left: 4px solid var(--primary); }
        .comissao-card-header { padding: 1.2rem; background: var(--bg); border-bottom: 1px solid var(--border); }
        .comissao-card-header h4 { margin-bottom: 0.3rem; }
        .comissao-card-header p { font-size: 0.85rem; color: var(--text-muted); }
        .parcelas-list { padding: 1rem; }
        .parcela-item { display: flex; align-items: center; justify-content: space-between; padding: 0.8rem; border: 1px solid var(--border); border-radius: 8px; margin-bottom: 0.5rem; background: var(--bg); }
        .parcela-item.paga { border-left: 4px solid var(--success); background: #f0fdf4; }
        .parcela-info { flex: 1; }
        .parcela-letra { font-weight: 700; color: var(--primary); margin-right: 0.5rem; }
        .parcela-valor { font-size: 0.9rem; color: var(--text-muted); }
        .parcela-comissao { font-size: 0.8rem; color: var(--success); font-weight: 600; }
        .parcela-actions { display: flex; align-items: center; gap: 0.5rem; margin-left: 1rem; }
        .parcela-actions input[type="date"] { padding: 0.3rem; border: 1px solid var(--border); border-radius: 4px; font-size: 0.85rem; }
        .parcela-actions input[type="checkbox"] { width: 18px; height: 18px; cursor: pointer; }
        .admin-only { display: none; }
        body.admin-mode .admin-only { display: inline-flex; }
        .relatorio-btn { background: var(--success); color: white; }
        .relatorio-btn:hover { background: #059669; }
        
        /* Aba Pendências */
        .comissoes-tabs { display: flex; gap: 0.5rem; margin-bottom: 1.5rem; border-bottom: 2px solid var(--border); }
        .comissoes-tab { padding: 0.8rem 1.5rem; cursor: pointer; font-weight: 500; border-bottom: 3px solid transparent; margin-bottom: -2px; }
        .comissoes-tab.active { color: var(--primary); border-bottom-color: var(--primary); }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        
        .filtros-container { background: var(--card); padding: 1.2rem; border-radius: 12px; box-shadow: var(--shadow); margin-bottom: 1.5rem; display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 1rem; }
        .filtro-group label { display: block; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 0.3rem; font-weight: 500; }
        .filtro-group input, .filtro-group select { width: 100%; padding: 0.5rem; border: 1px solid var(--border); border-radius: 6px; font-size: 0.9rem; }
        
        .pendencias-lista { background: var(--card); border-radius: 12px; box-shadow: var(--shadow); overflow: hidden; }
        .pendencia-item { display: grid; grid-template-columns: 80px 1fr 120px 120px 100px 80px 80px; gap: 1rem; padding: 1rem; border-bottom: 1px solid var(--border); align-items: center; }
        .pendencia-item:last-child { border-bottom: none; }
        .pendencia-item:hover { background: var(--bg); }
        .pendencia-header { background: var(--bg); font-weight: 600; font-size: 0.85rem; color: var(--text-muted); text-transform: uppercase; }
        .pendencia-item input[type="checkbox"] { width: 20px; height: 20px; cursor: pointer; }
        
        @media (max-width: 900px) {
            .pendencia-item { grid-template-columns: 1fr 1fr; gap: 0.5rem; }
            .pendencia-header { display: none; }
        }
    </style>
</head>
<body>

<div id="comissoes-app">
    <div class="comissoes-header">
        <div>
            <button class="btn btn-secondary btn-sm" onclick="window.location.href='index.html'">← Voltar ao Hub</button>
            <h2 style="margin-top:0.5rem">Gestão de Comissões <span id="userBadge" style="font-size:0.8rem; background:var(--bg); padding:0.2rem 0.5rem; border-radius:12px; color:var(--text-muted);"></span></h2>
        </div>
        <div class="header-actions admin-only">
            <button class="btn relatorio-btn" onclick="exportarRelatorio()">📊 Exportar Relatório</button>
            <button class="btn btn-primary" onclick="openModal('modalComissao')">+ Adicionar Comissão</button>
        </div>
    </div>

    <div class="comissoes-tabs">
        <div class="comissoes-tab active" onclick="switchComissaoTab('tab-principal', this)">💼 Comissões</div>
        <div class="comissoes-tab" onclick="switchComissaoTab('tab-pendencias', this)">⚠️ Pendências</div>
    </div>

    <!-- ABA PRINCIPAL -->
    <div id="tab-principal" class="tab-content active">
        <div class="resumo-cards">
            <div class="resumo-card">
                <h3>Previsão do Mês</h3>
                <p class="valor" id="resumoPrevisao">R$ 0,00</p>
                <small style="color:var(--text-muted)">Parcelas elegíveis (23 a 22)</small>
            </div>
            <div class="resumo-card previsao">
                <h3>Comissão a Receber</h3>
                <p class="valor" id="resumoReceber">R$ 0,00</p>
                <small style="color:var(--text-muted)">Pagas e elegíveis</small>
            </div>
        </div>

        <div class="mes-selector-container">
            <h3>📅 Selecionar Mês de Referência</h3>
            <div class="mes-scroll" id="mesScroll"></div>
        </div>

        <div class="cards-grid" id="cardsGrid"></div>
    </div>

    <!-- ABA PENDÊNCIAS -->
    <div id="tab-pendencias" class="tab-content">
        <div class="filtros-container">
            <div class="filtro-group">
                <label>Nota Fiscal</label>
                <input type="text" id="filtroNF" placeholder="Buscar NF..." oninput="renderPendencias()">
            </div>
            <div class="filtro-group">
                <label>Cliente</label>
                <input type="text" id="filtroCliente" placeholder="Buscar cliente..." oninput="renderPendencias()">
            </div>
            <div class="filtro-group">
                <label>Mês de Referência</label>
                <select id="filtroMes" onchange="renderPendencias()">
                    <option value="">Todos</option>
                </select>
            </div>
            <div class="filtro-group">
                <label>Valor Mín. Parcela (R$)</label>
                <input type="number" id="filtroValorMin" step="0.01" placeholder="0,00" oninput="renderPendencias()">
            </div>
            <div class="filtro-group">
                <label>Valor Máx. Parcela (R$)</label>
                <input type="number" id="filtroValorMax" step="0.01" placeholder="999999" oninput="renderPendencias()">
            </div>
            <div class="filtro-group">
                <label>Data Início</label>
                <input type="date" id="filtroDataInicio" onchange="renderPendencias()">
            </div>
            <div class="filtro-group">
                <label>Data Fim</label>
                <input type="date" id="filtroDataFim" onchange="renderPendencias()">
            </div>
            <div class="filtro-group">
                <label>Percentual Comissão</label>
                <select id="filtroPercentual" onchange="renderPendencias()">
                    <option value="">Todos</option>
                    <option value="1">1%</option>
                    <option value="0.9">0.9%</option>
                    <option value="0.8">0.8%</option>
                    <option value="0.7">0.7%</option>
                </select>
            </div>
        </div>

        <div class="pendencias-lista">
            <div class="pendencia-item pendencia-header">
                <div>Parcela</div>
                <div>Cliente / NF</div>
                <div>Data Pagamento</div>
                <div>Valor Parcela</div>
                <div>Comissão</div>
                <div>Percentual</div>
                <div>Pago</div>
            </div>
            <div id="pendenciasBody"></div>
        </div>
    </div>
</div>

<!-- MODAL ADICIONAR COMISSÃO -->
<div class="modal-overlay" id="modalComissao">
    <div class="modal">
        <h2>Adicionar Comissão</h2>
        <div class="form-group"><label>Nome do Cliente</label><input type="text" id="comissaoCliente" placeholder="Ex: João Silva"></div>
        <div class="form-group"><label>Número da Nota Fiscal</label><input type="text" id="comissaoNota" placeholder="Ex: NF-001234"></div>
        <div class="form-group"><label>Quantidade de Parcelas</label><input type="number" id="comissaoParcelas" min="1" max="24" placeholder="Ex: 12"></div>
        <div class="form-group"><label>Valor da Parcela (R$)</label><input type="number" id="comissaoValor" step="0.01" placeholder="Ex: 1000.00"></div>
        <div class="form-group"><label>Percentual da Comissão</label>
            <select id="comissaoPercentual">
                <option value="1">1% (Padrão)</option>
                <option value="0.9">0.9%</option>
                <option value="0.8">0.8%</option>
                <option value="0.7">0.7%</option>
            </select>
        </div>
        <div class="modal-actions">
            <div></div>
            <div class="modal-actions-right">
                <button class="btn btn-secondary" onclick="closeModal('modalComissao')">Cancelar</button>
                <button class="btn btn-primary admin-only" onclick="saveComissao()">Salvar</button>
            </div>
        </div>
    </div>
</div>

<!-- MODAL EDITAR PARCELA -->
<div class="modal-overlay" id="modalEditarParcela">
    <div class="modal">
        <h2>Editar Comissão</h2>
        <input type="hidden" id="editParcelaId">
        <div class="form-group"><label>Nome do Cliente</label><input type="text" id="editCliente" placeholder="Ex: João Silva"></div>
        <div class="form-group"><label>Número da Nota Fiscal</label><input type="text" id="editNota" placeholder="Ex: NF-001234"></div>
        <div class="form-group"><label>Valor da Parcela (R$)</label><input type="number" id="editValor" step="0.01" placeholder="Ex: 1000.00"></div>
        <div class="form-group"><label>Percentual da Comissão</label>
            <select id="editPercentual">
                <option value="1">1% (Padrão)</option>
                <option value="0.9">0.9%</option>
                <option value="0.8">0.8%</option>
                <option value="0.7">0.7%</option>
            </select>
        </div>
        <div class="modal-actions">
            <div></div>
            <div class="modal-actions-right">
                <button class="btn btn-secondary" onclick="closeModal('modalEditarParcela')">Cancelar</button>
                <button class="btn btn-primary" onclick="saveEditParcela()">Salvar Alterações</button>
            </div>
        </div>
    </div>
</div>

<script src="comissoes.js"></script>
</body>
</html>
