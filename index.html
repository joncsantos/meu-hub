<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Hub</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- TELA DE LOGIN -->
<div id="login-screen">
    <div class="login-card">
        <h1> Acesso ao Hub</h1>
        <input type="password" id="loginPassword" placeholder="Digite a senha" onkeypress="if(event.key === 'Enter') checkLogin()">
        <button class="btn btn-primary" style="width:100%" onclick="checkLogin()">Entrar</button>
    </div>
</div>

<!-- MENU PRINCIPAL (HUB) -->
<div id="main-menu" class="hidden">
    <h1>🚀 Meu Hub de Atividades</h1>
    <div class="hub-grid" id="hubGrid">
        <!-- Cards injetados via JS conforme o perfil -->
    </div>
    <div style="text-align:center; margin-top:2rem;">
        <button class="btn btn-secondary" onclick="logout()">Sair</button>
    </div>
</div>

<script src="auth.js"></script>
</body>
</html>
